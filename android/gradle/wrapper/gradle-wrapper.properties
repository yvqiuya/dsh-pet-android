distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 官方地址 services.gradle.org 会 302 到 github.com/gradle/gradle-distributions，
# GitHub 的 release-assets CDN 不稳定时（504）CI 会直接挂在下载 Gradle 这一步。
# 这里改用腾讯云镜像（与官方包字节完全一致，见下方 distributionSha256Sum），
# 想换回官方地址把 URL 改成 https\://services.gradle.org/distributions/gradle-8.7-bin.zip 即可。
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.7-bin.zip
distributionSha256Sum=544c35d6bd849ae8a5ed0bcea39ba677dc40f49df7d1835561582da2009b961d
networkTimeout=120000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
